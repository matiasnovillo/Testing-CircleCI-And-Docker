version: 2.1

orbs:
  azure-acr: circleci/azure-acr@0.2.0

jobs:
  build_and_test:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - checkout
      - run:
          name: Restore dependencies
          command: dotnet restore FiyiStack.sln
      - run:
          name: Build solution
          command: dotnet build FiyiStack.sln --configuration Release --no-restore
      - run:
          name: Run unit tests
          command: dotnet test FiyiStack.sln --configuration Release --no-build --no-restore

  build_and_push_image:
    docker:
      - image: cimg/azure:2026.10.1
    steps:
      - checkout
      - setup_remote_docker:
          version: default
      - run:
          name: Log in to Azure via OIDC
          command: |
            az login --service-principal \
              -u "$AZURE_CLIENT_ID" \
              -t "$AZURE_TENANT_ID" \
              --federated-token "$CIRCLE_OIDC_TOKEN"
      - run:
          name: Resolve ACR login server and log in
          command: |
            # Azure puede asignar un loginServer distinto de <nombre>.azurecr.io.
            ACR_LOGIN_SERVER=$(az acr show \
              --name "$AZURE_ACR_NAME" \
              --query loginServer \
              --output tsv)
            if [ -z "$ACR_LOGIN_SERVER" ] || [ "$ACR_LOGIN_SERVER" = "null" ]; then
              echo "No se pudo obtener loginServer (Servidor de inicio de sesion). Revisa AZURE_ACR_NAME y la suscripción de Azure." >&2
              exit 1
            fi
            printf 'export ACR_LOGIN_SERVER=%q\n' "$ACR_LOGIN_SERVER" >> "$BASH_ENV"
            az acr login --name "$AZURE_ACR_NAME"
      - run:
          name: Build and Push Docker Image
          command: |
            # El contexto debe coincidir con las rutas COPY del Dockerfile.
            docker build \
              --file src/FiyiStack/Dockerfile \
              --tag "$ACR_LOGIN_SERVER/fiyistack-app:$CIRCLE_SHA1" \
              src/FiyiStack
            # Agregamos un retry automático al push por si hay fluctuaciones en la red remota
            docker push "$ACR_LOGIN_SERVER/fiyistack-app:$CIRCLE_SHA1" || \
            (sleep 5 && docker push "$ACR_LOGIN_SERVER/fiyistack-app:$CIRCLE_SHA1")

  deploy_to_vm:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - add_ssh_keys:
          fingerprints:
            - "SHA256:rWonafvavuzFcGNGUaXApnF7oZBtQjobgs+5UugevMk"
      - run:
          name: Deploy via SSH to Azure VM
          command: |
            : "${VM_USER:?Configura VM_USER en el contexto FiyiStackContext (ejemplo: fiyistack-su)}"
            : "${VM_IP:?Configura VM_IP en el contexto FiyiStackContext (ejemplo: 52.154.75.2)}"
            if [[ "$VM_USER" =~ [[:space:]@] || "$VM_IP" =~ [[:space:]@] || "$VM_USER" == -* || "$VM_IP" == -* ]]; then
              echo "VM_USER debe contener solo el usuario y VM_IP solo la IP o el hostname, sin espacios ni @." >&2
              exit 1
            fi
            : "${AZURE_ACR_NAME:?Configura AZURE_ACR_NAME en FiyiStackContext}"
            ssh -T -o BatchMode=yes -o StrictHostKeyChecking=no "${VM_USER}@${VM_IP}" 'bash -se' \<< EOF
              set -euo pipefail
              # Docker y la instalacion de Azure CLI requieren sudo sin contraseña.
              sudo -n true
              sudo -n docker info > /dev/null
              if ! command -v az > /dev/null 2>&1; then
                installer=\$(mktemp)
                curl --fail --silent --show-error --location https://aka.ms/InstallAzureCLIDeb -o "\$installer"
                sudo -n bash "\$installer"
                rm -f "\$installer"
              fi
              # La VM debe tener identidad administrada con permiso de lectura en ACR.
              az login --identity --output none
              ACR_LOGIN_SERVER=\$(az acr show --name "$AZURE_ACR_NAME" --query loginServer --output tsv)
              test -n "\$ACR_LOGIN_SERVER" && test "\$ACR_LOGIN_SERVER" != null
              # Credenciales temporales en un directorio que se elimina al terminar.
              DOCKER_CONFIG_DIR=\$(mktemp -d)
              trap 'sudo -n rm -rf -- "\$DOCKER_CONFIG_DIR"' EXIT
              az acr login --name "$AZURE_ACR_NAME" --expose-token --query accessToken --output tsv | \
                sudo -n docker --config "\$DOCKER_CONFIG_DIR" login "\$ACR_LOGIN_SERVER" \
                  --username 00000000-0000-0000-0000-000000000000 --password-stdin
              
              # 2. Bajar la nueva imagen
              sudo -n docker --config "\$DOCKER_CONFIG_DIR" pull "\$ACR_LOGIN_SERVER/fiyistack-app:${CIRCLE_SHA1}"
              
              # Verificar el archivo antes de detener el contenedor actual.
              test -r /home/fiyistack-su/fiyistack/.env
              # La base iniciada con compose -p fiyistack usa esta red.
              sudo -n docker network inspect fiyistack_default > /dev/null
              # 3. Frenar el contenedor viejo y levantar el nuevo (o actualizar vía docker-compose)
              if sudo -n docker container inspect fiyistack-container > /dev/null 2>&1; then
                sudo -n docker stop fiyistack-container
                sudo -n docker rm fiyistack-container
              fi
              
              sudo -n docker run -d \
                --name fiyistack-container \
                --network fiyistack_default \
                --env-file /home/fiyistack-su/fiyistack/.env \
                -p 8080:8080 \
                --restart unless-stopped \
                "\$ACR_LOGIN_SERVER/fiyistack-app:${CIRCLE_SHA1}"
            EOF

workflows:
  version: 2
  ci_cd_pipeline:
    jobs:
      - build_and_test
      - build_and_push_image:
          context: FiyiStackContext
          requires:
            - build_and_test
          filters:
            branches:
              only: main
      - deploy_to_vm:
          context: FiyiStackContext
          requires:
            - build_and_push_image
          filters:
            branches:
              only: main
