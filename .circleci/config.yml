version: 2.1

orbs:
  azure-acr: circleci/azure-acr@0.2.0

jobs:
  build_and_test:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      # 1. Descargar el código del repositorio
      - checkout
      # 2. Restaurar dependencias NuGet
      - run:
          name: Restore dependencies
          command: dotnet restore FiyiStack.sln
      # 3. Compilar la solución
      - run:
          name: Build solution
          command: dotnet build FiyiStack.sln --configuration Release --no-restore
      # 4. Ejecutar tests automatizados
      - run:
          name: Run unit tests
          command: dotnet test FiyiStack.sln --configuration Release --no-build --no-restore

  build_and_push_image:
    docker:
      - image: cimg/azure:2026.10.1
    steps:
      - checkout
      - setup_remote_docker:
          version: default
      - run:
          name: Log in to Azure via OIDC
          command: |
            az login --service-principal \
              -u "$AZURE_CLIENT_ID" \
              -t "$AZURE_TENANT_ID" \
              --federated-token "$CIRCLE_OIDC_TOKEN"
      - run:
          name: Resolve ACR login server and log in
          command: |
            # Azure puede asignar un loginServer distinto de <nombre>.azurecr.io.
            ACR_LOGIN_SERVER=$(az acr show \
              --name "$AZURE_ACR_NAME" \
              --query loginServer \
              --output tsv)
            if [ -z "$ACR_LOGIN_SERVER" ] || [ "$ACR_LOGIN_SERVER" = "null" ]; then
              echo "No se pudo obtener loginServer (Servidor de inicio de sesion). Revisa AZURE_ACR_NAME y la suscripción de Azure." >&2
              exit 1
            fi
            printf 'export ACR_LOGIN_SERVER=%q\n' "$ACR_LOGIN_SERVER" >> "$BASH_ENV"
            az acr login --name "$AZURE_ACR_NAME"
      - run:
          name: Build and Push Docker Image
          command: |
            # El contexto debe coincidir con las rutas COPY del Dockerfile.
            docker build \
              --file src/FiyiStack/Dockerfile \
              --tag "$ACR_LOGIN_SERVER/fiyistack-app:$CIRCLE_SHA1" \
              src/FiyiStack
            # Agregamos un retry automático al push por si hay fluctuaciones en la red remota
            docker push "$ACR_LOGIN_SERVER/fiyistack-app:$CIRCLE_SHA1" || \
            (sleep 5 && docker push "$ACR_LOGIN_SERVER/fiyistack-app:$CIRCLE_SHA1")

  deploy_to_vm:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - add_ssh_keys:
          fingerprints:
            - "SHA256:rWonafvavuzFcGNGUaXApnF7oZBtQjobgs+5UugevMk"
      - run:
          name: Deploy via SSH to Azure VM
          command: |
            ssh -o StrictHostKeyChecking=no $VM_USER@$VM_IP \<< EOF
              # 1. Autenticar la VM contra el ACR usando la identidad gestionada de la VM o credenciales temporales
              az login --identity || true # Si la VM tiene una Managed Identity asignada con rol AcrPull
              az acr login --name "$AZURE_ACR_NAME"
              
              # 2. Bajar la nueva imagen
              docker pull ${AZURE_ACR_NAME}.azurecr.io/fiyistack-app:${CIRCLE_SHA1}
              
              # 3. Frenar el contenedor viejo y levantar el nuevo (o actualizar vía docker-compose)
              docker stop fiyistack-container || true
              docker rm fiyistack-container || true
              
              docker run -d \
                --name fiyistack-container \
                -p 8080:8080 \
                --restart unless-stopped \
                ${AZURE_ACR_NAME}.azurecr.io/fiyistack-app:${CIRCLE_SHA1}
            EOF

workflows:
  version: 2
  ci_cd_pipeline:
    jobs:
      - build_and_test
      - build_and_push_image:
          context: FiyiStackContext
          requires:
            - build_and_test
          filters:
            branches:
              only: main
      - deploy_to_vm:
          context: FiyiStackContext
          requires:
            - build_and_push_image
          filters:
            branches:
              only: main
